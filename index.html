<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Contact Form</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 520px; margin: 40px auto; padding: 20px; }
    h1 { text-align: center; }
    label { display: block; margin-top: 14px; }
    input { box-sizing: border-box; width: 100%; padding: 10px; margin-top: 5px; }
    button { margin-top: 18px; padding: 10px 18px; cursor: pointer; }
  </style>
</head>
<body>
  <h1>Contact Form</h1>
  <form id="contactForm">
    <label for="name">Name</label>
    <input type="text" id="name" name="name" required>

    <label for="email">Email</label>
    <input type="email" id="email" name="email" required>

    <label for="contact">Contact Number</label>
    <input type="tel" id="contact" name="contact" required>

    <button type="submit">Submit</button>
    <p id="message" aria-live="polite"></p>
  </form>
  <script>
    document.getElementById("contactForm").addEventListener("submit", function (event) {
      event.preventDefault();
      document.getElementById("message").textContent = "Form submitted successfully!";
    });
  </script>
</body>
</html>
